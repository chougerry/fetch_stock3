name: Auto Fetch Stock MA Diff

on:
  schedule:
    # 每天 UTC 時間 07:00 執行 (相當於台灣時間 15:00，週一至週五)
    - cron: '0 7 * * 1-5'
  # 允許在 GitHub Actions 頁面手動點擊按鈕立即執行
  workflow_dispatch:

permissions:
  contents: write  # 賦予寫入權限以儲存 stock_ma_diff.csv

jobs:
  fetch-and-calculate:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 檢出 Repository 程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安裝所需套件
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 執行抓取與均線計算腳本
        run: python fetch_stocks.py

      - name: 5. 將結果 stock_ma_diff.csv 存回 GitHub
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add stock_ma_diff.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update stock MA diff data" && git push)
